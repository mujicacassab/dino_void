<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DINO VOID — Evolución</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #04040a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #wrap { position: relative; box-shadow: 0 0 70px rgba(120,40,200,0.35); border-radius: 6px; }
  canvas { display: block; cursor: pointer; background: #000; border-radius: 6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
const C = document.getElementById('c'), G = C.getContext('2d');
const LW = 800, LH = 450;
let scale = 1;
function resize(){
  scale = Math.min(window.innerWidth/LW, window.innerHeight/LH);
  C.width = LW; C.height = LH;
  C.style.width = (LW*scale)+'px'; C.style.height = (LH*scale)+'px';
}
resize(); window.addEventListener('resize', resize);

const ST = { START:0, D2:1, TRANS:2, D3:3, DEAD:4, WIN:5, CRASH:6, CLOSE:7 };
let state = ST.START;

// Parámetros
const GROUND_Y = 300, GRAVITY = 0.72, JUMP_V = -15;
const SCORE_TRANS = 300, SCORE_WIN = 600;
const VP = { x: LW/2, y: 168 };
const NEAR_Y = LH-46, NEAR_W = 360, FAR_W = 6;
const LANES = [-0.62, 0, 0.62];

let score = 0, hi = 0, tick = 0, shake = 0;

// 2D
let dino = { x:95, y:GROUND_Y, vy:0, ground:true, leg:0, legT:0 };
let obstacles = [], clouds = [], groundOff = 0, spd2 = 6, nextObs = 50;

// transición
let transT = 0; const TRANS_TOTAL = 360;
let codeRain = [], dinoFX = 0, dinoFY = 0, trImpact = false;
const CODE = "01{}<>/=;\u0394\u03bb#$";

// fondo de estrellas persistente
let stars = [];
function initStars(){ stars = []; for (let i=0;i<150;i++) stars.push({ x:Math.random()*LW, y:Math.random()*VP.y, r:Math.random()*1.7+0.3, ph:Math.random()*6.28, sp:0.6+Math.random()*1.8 }); }
initStars();

// 3D
let lane = 1, dinoX = 0, obs3 = [], nextObs3 = 70, spd3 = 0.011, portalZ = -1, laneFX = 0;
let crashT = 0, closeT = 0, flyDino = null;

// ============================================================
// CANVAS FUERA DE PANTALLA (bloom, motion-blur, aberración)
// ============================================================
function offscreen(w,h){ const o=document.createElement('canvas'); o.width=w; o.height=h; return o; }
const BL = offscreen(LW/2, LH/2), BLX = BL.getContext('2d');   // bloom
const PV = offscreen(LW, LH),     PVX = PV.getContext('2d');   // motion-blur (frame previo)
const TR = offscreen(LW, LH),     TRX = TR.getContext('2d');   // canal rojo
const TGc= offscreen(LW, LH),     TGX = TGc.getContext('2d');  // canal verde
const TB = offscreen(LW, LH),     TBX = TB.getContext('2d');   // canal azul

// ruido para grano/CRT
const NZ = offscreen(220, 130), NZX = NZ.getContext('2d');
(function(){ const id=NZX.createImageData(NZ.width,NZ.height); for (let i=0;i<id.data.length;i+=4){ const v=(Math.random()*255)|0; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; } NZX.putImageData(id,0,0); })();
// scanlines estáticas
const SCAN = offscreen(LW, LH), SCX = SCAN.getContext('2d');
(function(){ SCX.fillStyle='rgba(0,0,0,0.22)'; for (let y=0;y<LH;y+=3) SCX.fillRect(0,y,LW,1); })();

function bloom(intensity, blurPx){
  noGlow();
  BLX.setTransform(1,0,0,1,0,0); BLX.globalCompositeOperation='source-over';
  BLX.clearRect(0,0,BL.width,BL.height);
  BLX.filter='blur('+(blurPx*0.5)+'px)';
  BLX.drawImage(C,0,0,BL.width,BL.height);
  BLX.filter='none';
  G.save(); G.setTransform(1,0,0,1,0,0);
  G.globalCompositeOperation='lighter'; G.globalAlpha=intensity;
  G.filter='blur('+(blurPx*0.5)+'px)';
  G.drawImage(BL,0,0,LW,LH);
  G.restore();
}
function vignette(strength){
  G.save(); G.setTransform(1,0,0,1,0,0);
  const g=G.createRadialGradient(LW/2,LH*0.52,LH*0.32,LW/2,LH*0.52,LW*0.66);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+strength+')');
  G.fillStyle=g; G.fillRect(0,0,LW,LH); G.restore();
}
function scanlines(alpha){ G.save(); G.setTransform(1,0,0,1,0,0); G.globalAlpha=alpha; G.drawImage(SCAN,0,0); G.restore(); }
function grain(alpha){ G.save(); G.setTransform(1,0,0,1,0,0); G.globalAlpha=alpha; G.globalCompositeOperation='overlay'; const ox=(Math.random()*60)|0, oy=(Math.random()*60)|0; G.drawImage(NZ,-ox,-oy,LW+60,LH+60); G.restore(); }
function tintCopy(ctx, col){ ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,LW,LH); ctx.drawImage(C,0,0); ctx.globalCompositeOperation='multiply'; ctx.fillStyle=col; ctx.fillRect(0,0,LW,LH); ctx.globalCompositeOperation='source-over'; }
function chromAberration(off){
  noGlow();
  tintCopy(TRX,'#ff0000'); tintCopy(TGX,'#00ff00'); tintCopy(TBX,'#0000ff');
  G.save(); G.setTransform(1,0,0,1,0,0);
  G.clearRect(0,0,LW,LH);
  G.globalCompositeOperation='lighter';
  G.drawImage(TGc,0,0);
  G.drawImage(TR,-off,Math.round(off*0.25));
  G.drawImage(TB,off,-Math.round(off*0.25));
  G.restore();
}

// ===== entrada =====
const downK = {};
window.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (downK[e.code]) return; downK[e.code] = true; press(e.code);
});
window.addEventListener('keyup', e => { downK[e.code] = false; });
C.addEventListener('pointerdown', e => {
  const r = C.getBoundingClientRect(); ptr((e.clientX - r.left)/scale);
});
function setLane(n){ const old=lane; lane=Math.max(0,Math.min(2,n)); if (lane!==old) laneFX=1; }
function press(code){
  if (state===ST.START && (code==='Space'||code==='Enter')) return start();
  if (state===ST.DEAD || state===ST.WIN || state===ST.CLOSE){ if (code==='Space'||code==='Enter'||code==='KeyR') reset(); return; }
  if (state===ST.D2 && (code==='Space'||code==='ArrowUp')) jump();
  if (state===ST.D3){ if (code==='ArrowLeft') setLane(lane-1); if (code==='ArrowRight') setLane(lane+1); }
}
function ptr(px){
  if (state===ST.START) return start();
  if (state===ST.DEAD || state===ST.WIN || state===ST.CLOSE) return reset();
  if (state===ST.D2) jump();
  if (state===ST.D3){ if (px<LW/2) setLane(lane-1); else setLane(lane+1); }
}
function jump(){ if (dino.ground){ dino.vy = JUMP_V; dino.ground = false; } }

// ============================================================
// SISTEMA DE PARTÍCULAS UNIFICADO (chispas, plumas, escombros, polvo)
// ============================================================
const PS = {
  list: [],
  clear(){ this.list.length = 0; },
  add(p){ this.list.push(p); },
  spawn(x,y,type,opt){
    opt = opt || {};
    const a = opt.a!==undefined ? opt.a : Math.random()*6.283;
    const sp = opt.sp!==undefined ? opt.sp : 2+Math.random()*5;
    this.list.push({
      x, y, type,
      vx: opt.vx!==undefined ? opt.vx : Math.cos(a)*sp,
      vy: opt.vy!==undefined ? opt.vy : Math.sin(a)*sp,
      g: opt.g!==undefined ? opt.g : 0.12,
      drag: opt.drag!==undefined ? opt.drag : 1,
      life: 1, decay: opt.decay!==undefined ? opt.decay : 0.012+Math.random()*0.012,
      sz: opt.sz!==undefined ? opt.sz : 2+Math.random()*3,
      hue: opt.hue!==undefined ? opt.hue : 190,
      sat: opt.sat!==undefined ? opt.sat : 95,
      rot: Math.random()*6.283, vr: (Math.random()-0.5)*0.3,
      col: opt.col || null
    });
  },
  burst(x,y,n,type,opt){ for (let i=0;i<n;i++) this.spawn(x,y,type,opt); },
  update(){
    const l=this.list;
    for (let i=l.length-1;i>=0;i--){
      const p=l[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=p.drag; p.vy*=p.drag; p.rot+=p.vr;
      p.life-=p.decay;
      if (p.life<=0) l.splice(i,1);
    }
  },
  draw(){
    G.save();
    for (const p of this.list){
      if (p.life<=0) continue;
      if (p.type==='spark'){
        G.globalCompositeOperation='lighter';
        const c = p.col || ('hsla('+p.hue+','+p.sat+'%,65%,'+p.life+')');
        G.fillStyle=c; const s=p.sz*(0.4+p.life*0.8);
        G.fillRect(p.x-s/2,p.y-s/2,s,s);
      } else if (p.type==='dust'){
        G.globalCompositeOperation='lighter';
        G.fillStyle = p.col || ('hsla('+p.hue+','+p.sat+'%,80%,'+(p.life*0.9)+')');
        const s=p.sz*p.life; G.fillRect(p.x-s/2,p.y-s/2,s,s);
      } else if (p.type==='debris'){
        G.globalCompositeOperation='source-over';
        G.fillStyle = p.col || ('hsla('+p.hue+','+p.sat+'%,58%,'+p.life+')');
        G.save(); G.translate(p.x,p.y); G.rotate(p.rot); G.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz); G.restore();
      } else if (p.type==='feather'){
        G.globalCompositeOperation='source-over';
        G.save(); G.translate(p.x,p.y); G.rotate(p.rot);
        G.fillStyle='rgba(255,252,235,'+(p.life*0.95)+')';
        G.beginPath(); G.ellipse(0,0,p.sz*0.5,p.sz*1.4,0,0,6.283); G.fill();
        G.strokeStyle='rgba(200,215,255,'+(p.life*0.5)+')'; G.lineWidth=0.6;
        G.beginPath(); G.moveTo(0,-p.sz*1.4); G.lineTo(0,p.sz*1.4); G.stroke();
        G.restore();
      }
    }
    G.restore();
    G.globalCompositeOperation='source-over';
  }
};

// ===== inicio / reset =====
function start(){
  state = ST.D2; score = 0; tick = 0; spd2 = 6; nextObs = 50;
  dino = { x:95, y:GROUND_Y, vy:0, ground:true, leg:0, legT:0 };
  obstacles = []; groundOff = 0; clouds = []; PS.clear();
  for (let i=0;i<5;i++) clouds.push({ x:100+Math.random()*800, y:40+Math.random()*100, w:50+Math.random()*50, s:0.3+Math.random()*0.5 });
}
function reset(){ state = ST.START; PS.clear(); }

// ===== lógica 2D =====
function update2D(){
  tick++; score += 0.25; spd2 = 5.4 + score*0.008;
  groundOff = (groundOff + spd2) % 48;
  clouds.forEach(c => { c.x -= c.s; if (c.x < -120){ c.x = LW+60; c.y = 40+Math.random()*100; } });
  if (!dino.ground){ dino.vy += GRAVITY; dino.y += dino.vy; if (dino.y>=GROUND_Y){ dino.y=GROUND_Y; dino.vy=0; dino.ground=true; } }
  dino.legT++; if (dino.legT>4){ dino.leg=(dino.leg+1)%4; dino.legT=0; }
  nextObs--;
  if (nextObs<=0){ obstacles.push({ x:LW+20, dbl:Math.random()<0.22 }); nextObs = Math.max(58, 108-score*0.04) + Math.random()*62; }
  obstacles.forEach(o => o.x -= spd2);
  obstacles = obstacles.filter(o => o.x > -80);
  const db = { x:dino.x+11, y:dino.y-37, w:25, h:33 };
  for (const o of obstacles){
    const ob = o.dbl ? { x:o.x+4, y:GROUND_Y-50, w:38, h:50 } : { x:o.x+8, y:GROUND_Y-44, w:20, h:44 };
    if (db.x<ob.x+ob.w && db.x+db.w>ob.x && db.y<ob.y+ob.h && db.y+db.h>ob.y){ die(); return; }
  }
  if (score>=SCORE_TRANS) startTransition();
}

// ===== transición =====
function startTransition(){
  state = ST.TRANS; transT = 0; shake = 0; trImpact = false;
  dinoFX = dino.x; dinoFY = dino.y;
  codeRain = []; for (let i=0;i<110;i++) codeRain.push({ x:Math.random()*LW, y:Math.random()*LH-LH, spd:3+Math.random()*7, ch:CODE[(Math.random()*CODE.length)|0], a:0.4+Math.random()*0.6 });
  PS.clear();
}
function meteorPos(t){
  if (t<0.22){ const s=t/0.22; return { x: LW+40-(LW+40-(dinoFX+18))*s, y:-60+(dinoFY-78+60)*s, s }; }
  return { x:dinoFX+18, y:dinoFY-78, s:1 };
}
function updateTransition(){
  transT++;
  const t = transT/TRANS_TOTAL;
  PS.update();
  if (t < 0.34){
    const m=meteorPos(t);
    for (let i=0;i<3;i++) PS.spawn(m.x+(Math.random()-0.5)*8, m.y+(Math.random()-0.5)*8, 'spark', { vx:6+Math.random()*5, vy:-4-Math.random()*4, g:0.05, decay:0.04+Math.random()*0.03, sz:2+Math.random()*3, hue:18+Math.random()*26, sat:100 });
  }
  if (t>=0.34){ codeRain.forEach(p => { p.y += p.spd; if (p.y>LH){ p.y=-10; p.x=Math.random()*LW; p.ch=CODE[(Math.random()*CODE.length)|0]; } }); }
  if (!trImpact && t>=0.40){
    trImpact = true; shake = 22;
    PS.burst(dinoFX+18, dinoFY-78, 90, 'spark', { sp:2+Math.random()*8, g:0.15, decay:0.012, sz:2+Math.random()*4, hue:20+Math.random()*40, sat:100 });
    PS.burst(dinoFX+18, dinoFY-78, 26, 'debris', { sp:1+Math.random()*5, g:0.22, decay:0.01, sz:3+Math.random()*4, hue:18, sat:80 });
  }
  if (transT>=TRANS_TOTAL){ state=ST.D3; lane=1; dinoX=LANES[1]; obs3=[]; nextObs3=95; spd3=0.006; portalZ=-1; laneFX=0; PS.clear(); }
}

// ===== lógica 3D =====
function update3D(){
  tick++; score += 0.25; spd3 = 0.006 + (score-SCORE_TRANS)*0.000012;
  dinoX += (LANES[lane]-dinoX)*0.24;
  laneFX *= 0.86;
  PS.update();
  nextObs3--;
  if (portalZ<0 && nextObs3<=0 && score < SCORE_WIN-40){
    obs3.push({ z:0, gap:LANES[(Math.random()*3)|0], gw:0.62, jit:Math.random()*6.28, done:false });
    nextObs3 = 95 + Math.random()*62;
  }
  obs3.forEach(o => o.z += spd3);
  for (const o of obs3){ if (!o.done && o.z>0.9){ o.done=true; if (Math.abs(dinoX-o.gap) > o.gw/2){ crash(); return; } } }
  obs3 = obs3.filter(o => o.z < 1.15);
  // estela tech del dino
  if (tick%2===0){
    const z=0.9, hw=FAR_W+(NEAR_W-FAR_W)*z;
    const sx=VP.x+dinoX*hw, sy=VP.y+(NEAR_Y-VP.y)*z;
    PS.spawn(sx+(Math.random()-0.5)*16, sy+2, 'dust', { vx:(Math.random()-0.5)*0.6, vy:1.5+Math.random()*1.5, g:0, decay:0.05, sz:2+Math.random()*2, hue:185, sat:100 });
  }
  if (score >= SCORE_WIN-40 && portalZ<0) portalZ = 0;
  if (portalZ>=0){ portalZ += spd3*0.8; if (portalZ>=1) win(); }
}

function die(){ hi=Math.max(hi,Math.floor(score)); shake=14; state=ST.DEAD; }
function crash(){
  hi = Math.max(hi, Math.floor(score)); shake = 24; crashT = 0;
  const z=0.9, hw=FAR_W+(NEAR_W-FAR_W)*z;
  const sx=VP.x+dinoX*hw, sy=VP.y+(NEAR_Y-VP.y)*z;
  flyDino = { x:sx, y:sy-24, vx:0, vy:-3.2 };
  PS.clear();
  PS.burst(sx, sy-24, 46, 'debris', { sp:2+Math.random()*8, g:0.3, decay:0.014, sz:2+Math.random()*4, hue:8+Math.random()*42, sat:90 });
  PS.burst(sx, sy-24, 40, 'spark', { sp:3+Math.random()*7, g:0.12, decay:0.02, sz:2+Math.random()*3, hue:30+Math.random()*30, sat:100 });
  state = ST.CRASH;
}
function updateCrash(){
  crashT++;
  flyDino.x += Math.sin(crashT*0.08)*0.8;
  flyDino.y += flyDino.vy; if (flyDino.vy < -1.2) flyDino.vy += 0.02;
  PS.update();
  const grow=Math.max(0,Math.min(1,(crashT-12)/26));
  if (grow>0.2 && crashT%2===0){
    PS.spawn(flyDino.x+(Math.random()-0.5)*60, flyDino.y-10, 'feather', { vx:(Math.random()-0.5)*1.2, vy:1+Math.random()*1.5, g:0.02, drag:0.99, decay:0.01, sz:3+Math.random()*3 });
    PS.spawn(flyDino.x+(Math.random()-0.5)*50, flyDino.y-20, 'spark', { vx:(Math.random()-0.5)*1.5, vy:0.5+Math.random(), g:0.01, decay:0.02, sz:2, hue:48, sat:100 });
  }
  if (crashT > 110){ state = ST.CLOSE; closeT = 0; }
}
function win(){
  hi=Math.max(hi,Math.floor(score)); PS.clear();
  PS.burst(LW/2, LH/2, 120, 'spark', { sp:2+Math.random()*7, g:0.04, decay:0.012, sz:2+Math.random()*3, hue:160+Math.random()*180, sat:95 });
  PS.burst(LW/2, LH/2, 40, 'dust', { sp:1+Math.random()*4, g:0.01, decay:0.008, sz:2+Math.random()*2, hue:170+Math.random()*120, sat:90 });
  state=ST.WIN;
}

// ============================================================
// DIBUJO
// ============================================================
function glow(col, blur){ G.shadowColor=col; G.shadowBlur=blur; }
function noGlow(){ G.shadowBlur=0; }

function rrect(x,y,w,h,r){ G.beginPath(); G.moveTo(x+r,y); G.arcTo(x+w,y,x+w,y+h,r); G.arcTo(x+w,y+h,x,y+h,r); G.arcTo(x,y+h,x,y,r); G.arcTo(x,y,x+w,y,r); G.closePath(); }

// Insignias de marca (Platzi + Devin.ai), grandes y legibles
function badge(kind, cx, cy, sc){
  const bw=168*sc, bh=50*sc, r=12*sc;
  G.textAlign='center';
  if (kind==='platzi'){
    glow('#9bd13a',24*sc); G.fillStyle='#9bd13a'; rrect(cx-bw/2,cy-bh/2,bw,bh,r); G.fill(); noGlow();
    G.fillStyle='#0d1b2a'; G.font='bold '+(27*sc)+'px Courier New'; G.fillText('Platzi', cx, cy+9*sc);
  } else {
    G.fillStyle='#0b1030'; rrect(cx-bw/2,cy-bh/2,bw,bh,r); G.fill();
    glow('#26e6ff',20*sc); G.strokeStyle='#26e6ff'; G.lineWidth=2.4*sc; rrect(cx-bw/2,cy-bh/2,bw,bh,r); G.stroke(); noGlow();
    glow('#26e6ff',10*sc); G.fillStyle='#eafdff'; G.font='bold '+(25*sc)+'px Courier New'; G.fillText('Devin.ai', cx, cy+9*sc); noGlow();
  }
}
function brandBadges(cx, cy, sc, alpha){
  G.save(); G.globalAlpha = alpha;
  const bw = 168*sc, gap = 22*sc, total = bw*2 + gap;
  badge('platzi', cx - total/2 + bw/2, cy, sc);
  badge('devin',  cx + total/2 - bw/2, cy, sc);
  G.restore();
}

// ----- ángel -----
function drawWing(wf, grow){
  // wf: factor de aleteo (~ -0.2..1) ; grow: aparición 0..1
  const layers = 3;
  for (let L=layers-1; L>=0; L--){
    const depth = L/(layers-1);
    const span = grow*(0.62 + L*0.20);
    const baseA = 0.55 + 0.45*(1-depth);
    const N = 6;
    for (let i=0;i<N;i++){
      const tt = i/(N-1);
      const ang = -1.9 + tt*1.5 - wf*0.42 - L*0.05;
      const len = (16 + tt*34) * span;
      const bx = 4 + L*1.5, by = -22 + L*3;
      const ex = bx + Math.cos(ang)*len, ey = by + Math.sin(ang)*len;
      const nx = Math.cos(ang+1.5708), ny = Math.sin(ang+1.5708);
      const wdt = (3 + tt*4) * span;
      // pluma con degradado: base azulada -> punta blanca, para que el plumaje se lea bajo el bloom
      const fg = G.createLinearGradient(bx, by, ex, ey);
      fg.addColorStop(0, 'rgba(150,185,245,'+(baseA*grow)+')');
      fg.addColorStop(1, 'rgba(255,253,240,'+(baseA*grow)+')');
      G.fillStyle = fg;
      G.beginPath();
      G.moveTo(bx, by);
      G.quadraticCurveTo(bx+nx*wdt, by+ny*wdt, ex, ey);
      G.quadraticCurveTo(bx-nx*wdt*0.5, by-ny*wdt*0.5, bx, by);
      G.closePath(); G.fill();
      // veta de la pluma para definir el plumaje en capas
      G.strokeStyle='rgba(90,120,190,'+(0.5*grow)+')'; G.lineWidth=0.9;
      G.beginPath(); G.moveTo(bx,by); G.lineTo(ex,ey); G.stroke();
    }
  }
}
function drawAngel(x, y, rot, sc, flap, grow){
  G.save(); G.translate(x, y); G.rotate(rot); G.scale(sc, sc);
  // haz de ascensión desde abajo
  if (grow>0.25){
    G.save(); G.globalCompositeOperation='lighter';
    const beam=G.createLinearGradient(0,80,0,-30);
    beam.addColorStop(0,'rgba(255,236,150,0)'); beam.addColorStop(1,'rgba(255,244,190,'+(0.30*grow)+')');
    G.fillStyle=beam; G.beginPath(); G.moveTo(-10,80); G.lineTo(10,80); G.lineTo(26,-30); G.lineTo(-26,-30); G.closePath(); G.fill();
    G.restore();
  }
  // aura
  const aura=G.createRadialGradient(0,-8,4,0,-8,70);
  aura.addColorStop(0,'rgba(255,248,200,'+(0.3*grow)+')'); aura.addColorStop(1,'rgba(255,240,170,0)');
  G.fillStyle=aura; G.beginPath(); G.arc(0,-8,70,0,6.283); G.fill();
  const wf=Math.sin(flap)*0.6+0.4;
  G.save(); drawWing(wf, grow); G.restore();
  G.save(); G.scale(-1,1); drawWing(wf, grow); G.restore();
  glow('#fff0b8', 9);
  drawDino(-18, 24, 0, '#efe6c2', false);
  noGlow();
  G.fillStyle='#caa23a'; G.fillRect(15, -21, 4, 4);
  // halo con destellos
  if (grow>0.3){
    glow('#ffe88a',18); G.strokeStyle='rgba(255,232,138,'+grow+')'; G.lineWidth=3;
    G.beginPath(); G.ellipse(2,-48,15,5,0,0,6.283); G.stroke(); noGlow();
    G.save(); G.globalCompositeOperation='lighter';
    for (let i=0;i<5;i++){
      const a=tick*0.06 + i*1.2566; const hx=2+Math.cos(a)*15, hy=-48+Math.sin(a)*5;
      const tw=0.5+0.5*Math.sin(tick*0.2+i);
      G.fillStyle='rgba(255,245,180,'+(grow*tw)+')'; const s=1.6+tw*1.8;
      G.fillRect(hx-s/2,hy-s/2,s,s);
    }
    G.restore();
  }
  G.restore();
}

// ----- dino -----
function drawDino(x,y,frame,col,tech){
  if (tech) glow('#26e6ff', 14);
  G.fillStyle = col;
  // cola
  G.fillRect(x-10, y-22, 7, 6);
  G.fillRect(x-6, y-20, 6, 8);
  // cuerpo
  G.fillRect(x, y-26, 12, 18);
  G.fillRect(x+9, y-36, 16, 28);
  // pecho
  G.fillRect(x+5, y-30, 6, 10);
  // cuello + cabeza
  G.fillRect(x+18, y-44, 8, 12);
  G.fillRect(x+21, y-50, 19, 16);
  G.fillRect(x+36, y-44, 7, 6);
  // mandíbula
  G.fillRect(x+23, y-36, 15, 4);
  // ojo
  G.fillStyle = tech ? '#ff3df0' : '#fff';
  G.fillRect(x+33, y-47, 4, 4);
  if (!tech){ G.fillStyle='#000'; G.fillRect(x+34, y-46, 2, 2); }
  G.fillStyle = col;
  // bracito
  G.fillRect(x+21, y-24, 6, 4);
  // patas — ciclo de carrera de 4 cuadros
  const f = frame & 3;
  const legA = [[0,8],[3,5],[6,3],[3,5]][f];
  const legB = [[6,3],[3,5],[0,8],[3,5]][f];
  G.fillRect(x+11, y-8, 6, legA[1]); G.fillRect(x+11, y-8+legA[0], 6, 8-legA[0]);
  G.fillRect(x+19, y-8, 6, legB[1]); G.fillRect(x+19, y-8+legB[0], 6, 8-legB[0]);
  if (tech){
    // acentos de circuito
    G.fillStyle='#ff3df0';
    G.fillRect(x+12,y-34,2,26); G.fillRect(x+16,y-30,8,2); G.fillRect(x+24,y-40,2,6);
    G.fillStyle='#7dfcff';
    G.fillRect(x+12,y-22,12,2); G.fillRect(x+20,y-34,2,8);
    glow('#ff3df0',8); G.fillStyle='#ff3df0'; G.fillRect(x+15,y-31,3,3); noGlow();
  }
  noGlow();
}

function scene2D(){
  // cielo monocromo con leve degradado
  const sky=G.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#fbfbfb'); sky.addColorStop(1,'#ececec');
  G.fillStyle=sky; G.fillRect(0,0,LW,LH);
  // sol pálido
  G.fillStyle='rgba(220,220,220,0.6)'; G.beginPath(); G.arc(120,80,34,0,6.283); G.fill();
  // nubes
  G.fillStyle = 'rgba(180,180,180,0.7)';
  clouds.forEach(c => { G.beginPath(); G.arc(c.x,c.y,c.w*0.3,0,6.283); G.arc(c.x+c.w*0.32,c.y-c.w*0.12,c.w*0.24,0,6.283); G.arc(c.x+c.w*0.6,c.y,c.w*0.26,0,6.283); G.fill(); });
  // suelo
  G.fillStyle = '#1c1c1c'; G.fillRect(0,GROUND_Y,LW,3);
  G.strokeStyle = '#bdbdbd'; G.lineWidth = 2;
  for (let x=-groundOff; x<LW; x+=48){ G.beginPath(); G.moveTo(x,GROUND_Y+14); G.lineTo(x+22,GROUND_Y+14); G.stroke(); }

  for (let x=-(groundOff*1.4)%70; x<LW; x+=70){ G.fillRect(x,GROUND_Y+24,4,2); }

  drawDino(dino.x, dino.y, dino.ground?dino.leg:0, '#1c1c1c', false);
}

// barra de progreso con (opcional) brillo
function hudBar(x,y,w,h,p,stroke,fillCol,glowy){
  G.save();
  G.strokeStyle=stroke; G.lineWidth=1; G.strokeRect(x,y,w,h);
  if (glowy){ glow(fillCol,10); }
  if (typeof fillCol==='object'){ G.fillStyle=fillCol; } else { G.fillStyle=fillCol; }
  G.fillRect(x,y,w*p,h);
  noGlow();
  G.restore();
}

// Marca + lemas persistentes (visibles durante todo el juego)
function brandStrip(light){
  const sc = 0.34;
  const total = 168*sc*2 + 22*sc, cx = LW - 16 - total/2;
  G.save();
  G.textAlign = 'center';
  if (light){ glow('rgba(150,200,255,0.6)',6); }
  G.fillStyle = light ? 'rgba(230,240,255,0.95)' : 'rgba(28,28,28,0.92)';
  G.font = 'bold 12px Courier New';
  G.fillText('Sobrevive a la extinci\u00f3n \u00b7 evoluciona \u00b7 IAprende', LW/2, 22);

  G.fillText('evoluciona \u00b7 IAprende', LW - 16, LH - 44);

  brandBadges(cx, LH - 22, sc, 1);
}

// ----- proyección / retrowave -----
function project(wx,z){ const hw=FAR_W+(NEAR_W-FAR_W)*z; return { x:VP.x+wx*hw, y:VP.y+(NEAR_Y-VP.y)*z, hw }; }

function retroSky(){
  // degradado de cielo
  const g=G.createLinearGradient(0,0,0,VP.y);
  g.addColorStop(0,'#0c0726'); g.addColorStop(0.55,'#3a1257'); g.addColorStop(1,'#7d1f6e');
  G.fillStyle=g; G.fillRect(0,0,LW,VP.y);
  // auroras animadas
  G.save(); G.globalCompositeOperation='lighter';
  for (let a=0;a<3;a++){
    const amp=10+a*6, yb=30+a*32, hue=a===0?'rgba(120,60,220,0.10)':a===1?'rgba(255,80,180,0.09)':'rgba(60,200,255,0.08)';
    G.fillStyle=hue; G.beginPath(); G.moveTo(0,yb);
    for (let x=0;x<=LW;x+=20){ G.lineTo(x, yb+Math.sin(x*0.012+tick*0.02+a)*amp); }
    G.lineTo(LW,0); G.lineTo(0,0); G.closePath(); G.fill();
  }
  G.restore();
  // estrellas con parpadeo variado
  stars.forEach(s=>{ if(s.y<VP.y){ const tw=0.3+0.7*Math.abs(Math.sin(s.ph+tick*0.04*s.sp)); G.fillStyle='rgba(255,255,255,'+(tw*0.85)+')'; G.fillRect(s.x,s.y,s.r,s.r); } });
  // sol con bandas animadas
  G.save();
  glow('#ff5fa8', 30);
  const sg=G.createRadialGradient(VP.x,VP.y-4,4,VP.x,VP.y-4,82);
  sg.addColorStop(0,'#ffe66b'); sg.addColorStop(0.5,'#ff8ad6'); sg.addColorStop(1,'rgba(255,95,168,0)');
  G.fillStyle=sg; G.beginPath(); G.arc(VP.x,VP.y-4,82,0,6.283); G.fill(); noGlow();
  // recorte al disco solar para las bandas
  G.beginPath(); G.arc(VP.x,VP.y-4,80,0,6.283); G.clip();
  G.fillStyle='#1a0a30';
  const off=(tick*0.4)%14;
  for (let i=0;i<7;i++){ const by=VP.y-34+off+i*13; G.fillRect(VP.x-82, by, 164, 3+i*0.6); }
  G.restore();
  // niebla en el horizonte
  const fog=G.createLinearGradient(0,VP.y-26,0,VP.y+10);
  fog.addColorStop(0,'rgba(255,120,200,0)'); fog.addColorStop(1,'rgba(140,40,140,0.55)');
  G.fillStyle=fog; G.fillRect(0,VP.y-26,LW,36);
}
function retroFloor(alpha){
  G.save(); G.globalAlpha=alpha;
  const fl=G.createLinearGradient(0,VP.y,0,LH);
  fl.addColorStop(0,'#0a0420'); fl.addColorStop(1,'#160630');
  G.fillStyle=fl; G.fillRect(0,VP.y,LW,LH-VP.y);
  // reflejo del sol
  G.save(); G.globalCompositeOperation='lighter';
  const sr=G.createLinearGradient(0,VP.y,0,LH);
  sr.addColorStop(0,'rgba(255,120,200,0.18)'); sr.addColorStop(0.5,'rgba(255,120,200,0.05)'); sr.addColorStop(1,'rgba(255,120,200,0)');
  G.fillStyle=sr; G.fillRect(VP.x-120,VP.y,240,LH-VP.y); G.restore();
  // líneas verticales con brillo por distancia
  for (let wx=-1; wx<=1.001; wx+=0.2){
    const a=project(wx,0), b=project(wx,1);
    G.strokeStyle='rgba(255,45,184,0.5)'; G.lineWidth=1.4;
    G.beginPath(); G.moveTo(a.x,a.y); G.lineTo(b.x,b.y); G.stroke();
  }
  // líneas horizontales animadas, más brillo cerca
  for (let i=0;i<18;i++){
    let z=((i/18)+(tick*0.005)%(1/18))%1;
    const p0=project(-1,z), p1=project(1,z);
    const br=0.08+z*0.55;
    G.strokeStyle='rgba(33,230,255,'+br+')'; G.lineWidth=0.5+z*2.0;
    if (z>0.7){ glow('#26e6ff', (z-0.7)*30); } else { noGlow(); }
    G.beginPath(); G.moveTo(p0.x,p0.y); G.lineTo(p1.x,p1.y); G.stroke();
  }
  noGlow();
  // bordes brillantes
  glow('#ff2db8',12); G.lineWidth=2.6; G.strokeStyle='#ff2db8';
  let e0=project(-1,0), e1=project(-1,1); G.beginPath(); G.moveTo(e0.x,e0.y); G.lineTo(e1.x,e1.y); G.stroke();
  e0=project(1,0); e1=project(1,1); G.beginPath(); G.moveTo(e0.x,e0.y); G.lineTo(e1.x,e1.y); G.stroke();
  noGlow();
  G.restore();
}

function drawBug(o){
  if (o.z<=0.02 || o.z>=1.12) return;
  const z=Math.min(o.z,1);
  const hw=FAR_W+(NEAR_W-FAR_W)*z, baseY=VP.y+(NEAR_Y-VP.y)*z;
  const jx=Math.sin(tick*0.6+o.jit)*z*4;
  const left=VP.x-hw+jx, right=VP.x+hw+jx;
  const gapC=VP.x+o.gap*hw+jx, gapH=o.gw/2*hw, gapL=gapC-gapH, gapR=gapC+gapH;
  const wallH=8+z*78, top=baseY-wallH;
  const close=o.z>0.72;
  glow(close?'#ff2b2b':'#23ff8a', 8+z*8);
  G.fillStyle = close ? 'hsl(0,80%,'+(28+z*22)+'%)' : 'hsl(145,80%,'+(24+z*20)+'%)';
  if (gapL>left)  G.fillRect(left, top, gapL-left, wallH);
  if (gapR<right) G.fillRect(gapR, top, right-gapR, wallH);
  noGlow();
  // textura tipo glitch
  G.fillStyle='rgba(0,0,0,0.5)';
  for (let yy=top+4; yy<baseY-2; yy+=Math.max(5,9*z)){
    if (gapL>left)  G.fillRect(left+3, yy, Math.max(3,(gapL-left-6)*Math.random()), 2*z+1);
    if (gapR<right) G.fillRect(gapR+3, yy, Math.max(3,(right-gapR-6)*Math.random()), 2*z+1);
  }
  // borde superior brillante
  G.fillStyle = close ? 'rgba(255,120,120,'+(0.4+z*0.4)+')' : 'rgba(160,255,210,'+(0.3+z*0.4)+')';
  if (gapL>left)  G.fillRect(left, top, gapL-left, 1.5+z*1.5);
  if (gapR<right) G.fillRect(gapR, top, right-gapR, 1.5+z*1.5);
}
function drawPortal(){
  if (portalZ<0) return;
  const z=Math.min(portalZ,1), cy=VP.y+(NEAR_Y-VP.y)*z-50*z, r=14+z*240;
  glow('#26e6ff',40);
  const g=G.createRadialGradient(VP.x,cy,r*0.2,VP.x,cy,r);
  g.addColorStop(0,'rgba(255,255,255,0.95)'); g.addColorStop(0.4,'rgba(120,255,230,0.7)'); g.addColorStop(1,'rgba(40,180,255,0)');
  G.fillStyle=g; G.beginPath(); G.arc(VP.x,cy,r,0,6.283); G.fill(); noGlow();
  // anillos rotatorios
  G.save(); G.globalCompositeOperation='lighter';
  for (let i=0;i<3;i++){ const rr=r*(0.4+i*0.2); G.strokeStyle='rgba(180,255,240,'+(0.4-i*0.1)+')'; G.lineWidth=2;
    G.beginPath(); G.ellipse(VP.x,cy,rr,rr*0.4,tick*0.04+i,0,6.283); G.stroke(); }
  G.restore();
}
function dino3D(){
  const z=0.9, hw=FAR_W+(NEAR_W-FAR_W)*z;
  const sx=VP.x+dinoX*hw, sy=VP.y+(NEAR_Y-VP.y)*z;
  // sombra
  G.fillStyle='rgba(38,230,255,0.18)'; G.beginPath(); G.ellipse(sx+18,sy+4,28,6,0,0,6.283); G.fill();
  // banca al cambiar de carril
  const tilt=Math.max(-0.22,Math.min(0.22,(LANES[lane]-dinoX)*1.4));
  G.save(); G.translate(sx+18,sy-18); G.rotate(tilt); G.translate(-(sx+18),-(sy-18));
  drawDino(sx, sy, Math.floor(tick/5)%4, '#19c9e6', true);
  G.restore();
}
function draw3DWorld(){

function draw3DHud(){

// ----- transición (momento WOW) -----
function drawTransition(){
  const t = transT/TRANS_TOTAL;
  let doChrom = false;

  if (t < 0.22){
    const s=t/0.22;
    scene2D();
    G.fillStyle='rgba(10,8,20,'+(s*0.75)+')'; G.fillRect(0,0,LW,LH);
    const m=meteorPos(t);
    PS.draw();
    // estela del meteorito + calor
    G.save(); G.globalCompositeOperation='lighter';
    const tg=G.createLinearGradient(m.x,m.y,m.x+140,m.y-95);
    tg.addColorStop(0,'rgba(255,210,120,0.8)'); tg.addColorStop(1,'rgba(255,90,40,0)');
    G.strokeStyle=tg; G.lineWidth=10*s; G.beginPath(); G.moveTo(m.x,m.y); G.lineTo(m.x+150,m.y-100); G.stroke();
    G.restore();
    glow('#ff7a2b',30+s*30);
    const mg=G.createRadialGradient(m.x,m.y,2,m.x,m.y,26+s*14);
    mg.addColorStop(0,'#fff'); mg.addColorStop(0.4,'#ffd36b'); mg.addColorStop(1,'#ff5a2b');
    G.fillStyle=mg; G.beginPath(); G.arc(m.x,m.y,26+s*14,0,6.283); G.fill(); noGlow();
    if (s>0.6){ G.fillStyle='rgba(255,60,60,'+((s-0.6)*2)+')'; G.font='bold 22px Courier New'; G.textAlign='center'; G.fillText('\u00a1EXTINCION INMINENTE!', LW/2, 70); G.textAlign='left'; }
  }
  else if (t < 0.34){
    scene2D();
    G.fillStyle='rgba(10,8,20,0.78)'; G.fillRect(0,0,LW,LH);
    const mx=dinoFX+18, my=dinoFY-78;
    glow('#ff7a2b',50); const mg=G.createRadialGradient(mx,my,2,mx,my,42);
    mg.addColorStop(0,'#fff'); mg.addColorStop(0.4,'#ffd36b'); mg.addColorStop(1,'#ff5a2b');
    G.fillStyle=mg; G.beginPath(); G.arc(mx,my,42,0,6.283); G.fill(); noGlow();
    PS.draw();
    // barras de glitch
    for (let i=0;i<14;i++){ const gy=Math.random()*LH, gh=2+Math.random()*9, gx=(Math.random()-0.5)*44;
      G.fillStyle='rgba('+(Math.random()>.5?255:0)+','+(Math.random()>.5?80:255)+','+(Math.random()>.5?255:80)+',0.4)'; G.fillRect(gx,gy,LW,gh); }
    G.fillStyle='rgba(60,255,120,0.85)'; G.font='14px Courier New';
    for (let i=0;i<28;i++) G.fillText(CODE[(Math.random()*CODE.length)|0], Math.random()*LW, Math.random()*LH);
    doChrom = true;
  }
  else if (t < 0.58){
    const s=(t-0.34)/0.24;
    G.fillStyle='#05060a'; G.fillRect(0,0,LW,LH);
    // lluvia de código tipo Matrix, más densa con cabeza brillante
    G.font='15px Courier New';
    codeRain.forEach(p => {
      G.fillStyle='rgba(180,255,200,'+Math.min(1,p.a+0.3)+')'; G.fillText(p.ch, p.x, p.y);
      G.fillStyle='rgba(40,200,90,'+(p.a*0.5)+')'; G.fillText(p.ch, p.x, p.y-15);
    });
    const cx=dinoFX+18, cy=dinoFY-40;
    // hexágono de energía rotando
    glow('#36ff7a',24); G.strokeStyle='rgba(60,255,140,'+Math.min(1,s*2)+')'; G.lineWidth=3;
    for (let ring=0; ring<3; ring++){ const rr=40+ring*22+Math.sin(tick*0.2+ring)*4; G.beginPath(); G.arc(cx,cy,rr*Math.min(1,s*1.4),0,6.283); G.stroke(); }
    G.beginPath();
    for (let a=0;a<6;a++){ const ang=a/6*6.283+tick*0.03, rr=70*Math.min(1,s*1.4); const px=cx+Math.cos(ang)*rr, py=cy+Math.sin(ang)*rr; a?G.lineTo(px,py):G.moveTo(px,py); }
    G.closePath(); G.stroke();
    // hexágono interior contrarrotando
    G.strokeStyle='rgba(160,255,200,'+Math.min(1,s*1.6)+')'; G.lineWidth=1.6; G.beginPath();
    for (let a=0;a<6;a++){ const ang=a/6*6.283-tick*0.05, rr=44*Math.min(1,s*1.4); const px=cx+Math.cos(ang)*rr, py=cy+Math.sin(ang)*rr; a?G.lineTo(px,py):G.moveTo(px,py); }
    G.closePath(); G.stroke(); noGlow();
    PS.draw();
    drawDino(dinoFX, dinoFY, 0, '#0f3', false);
    if (s>0.15){
      const a=Math.min(1,(s-0.15)*2.5);
      const pulse=1+Math.sin(tick*0.15)*0.05;
      brandBadges(LW/2, 150, 1.25*pulse, a);
      G.textAlign='center'; glow('#36ff7a',12); G.fillStyle='rgba(180,255,200,'+a+')'; G.font='bold 16px Courier New';
      G.fillText('> escudo de datos: PLATZI // DEVIN.AI', LW/2, 196);
      noGlow(); G.textAlign='left';
    }
  }
  else if (t < 0.78){
    const s=(t-0.58)/0.2;
    retroSky();
    retroFloor(s);
    // flash de ruptura con ondas expansivas
    G.fillStyle='rgba(255,255,255,'+(1-s)*0.9+')'; G.fillRect(0,0,LW,LH);
    G.save(); G.globalCompositeOperation='lighter';
    for (let r=0;r<3;r++){ const rr=s*420 - r*120; if (rr>0){ G.strokeStyle='rgba(180,240,255,'+((1-s)*0.7)+')'; G.lineWidth=4; G.beginPath(); G.arc(LW/2,LH/2,rr,0,6.283); G.stroke(); } }
    G.restore();
    glow('#26e6ff',20); G.textAlign='center'; G.fillStyle='rgba(38,230,255,'+Math.min(1,s*2)+')';
    G.font='bold 30px Courier New'; G.fillText('ROMPIENDO LA DIMENSION', LW/2, LH/2-30); noGlow(); G.textAlign='left';
  }
  else {
    const s=(t-0.78)/0.22;
    retroSky(); retroFloor(1);
    const z=0.9, sx=VP.x, sy=VP.y+(NEAR_Y-VP.y)*z;
    drawDino(sx, sy, Math.floor(tick/5)%4, '#19c9e6', true);
    glow('#ff2db8',14); G.textAlign='center'; G.fillStyle='rgba(255,200,255,'+Math.min(1,s*2)+')';
    G.font='bold 26px Courier New';
    G.fillText(s<0.55?'EVOLUCION COMPLETA':'\u2190  \u2192  ESQUIVA LOS BUGS', LW/2, LH/2-30); noGlow(); G.textAlign='left';
  }
  brandStrip(t>=0.34);
  return doChrom;
}

// ----- pantallas -----
function drawStart(){
  G.fillStyle='#0a0618'; G.fillRect(0,0,LW,LH);
  retroSky(); retroFloor(0.85);
  drawDino(LW/2-18, GROUND_Y+10, Math.floor(Date.now()/140)%4, '#19c9e6', true);
  G.textAlign='center';
  glow('#ff2db8',22); G.fillStyle='#ffffff'; G.font='bold 58px Courier New';
  G.fillText('DINO VOID', LW/2, 110); noGlow();
  glow('#26e6ff',8); G.fillStyle='#d8b8ff'; G.font='16px Courier New';
  G.fillText('Sobrevive a la extinci\u00f3n \u00b7 evoluciona \u00b7 IAprende', LW/2, 142); noGlow();
  G.fillStyle='#aef6ff'; G.font='14px Courier New';
  G.fillText('FASE 1  \u00b7  Salta los obstaculos    [ ESPACIO / \u2191 / CLICK ]', LW/2, 200);
  G.fillText('FASE 2  \u00b7  Cambia de carril         [ \u2190 \u2192 / CLICK ]', LW/2, 226);
  if (Math.floor(Date.now()/500)%2===0){ glow('#26e6ff',14); G.fillStyle='#fff'; G.font='bold 20px Courier New'; G.fillText('PRESIONA ESPACIO PARA INICIAR', LW/2, 276); noGlow(); }
  if (hi>0){ G.fillStyle='#9a8ac0'; G.font='14px Courier New'; G.fillText('MEJOR PUNTAJE  '+hi, LW/2, 348); }
  G.fillStyle='#8fe6c4'; G.font='12px Courier New'; G.fillText('I M P U L S A D O   P O R', LW/2, 388);
  brandBadges(LW/2, 416, 0.6, 1);
  G.textAlign='left';
}
function panel(title, tcol, glowc){
  G.fillStyle='rgba(6,6,16,0.84)'; rrect(LW/2-200,LH/2-110,400,220,14); G.fill();
  glow(glowc,16); G.strokeStyle=glowc; G.lineWidth=2; rrect(LW/2-200,LH/2-110,400,220,14); G.stroke(); noGlow();
  G.textAlign='center';
  glow(glowc,14); G.fillStyle=tcol; G.font='bold 38px Courier New'; G.fillText(title, LW/2, LH/2-46); noGlow();
  G.fillStyle='#cfe9ff'; G.font='18px Courier New';
  G.fillText('PUNTOS  '+Math.floor(score), LW/2, LH/2);
  G.fillText('MEJOR   '+hi, LW/2, LH/2+28);
  if (Math.floor(Date.now()/500)%2===0){ G.fillStyle='#fff'; G.font='14px Courier New'; G.fillText('ESPACIO / CLICK para reiniciar', LW/2, LH/2+74); }
  G.textAlign='left';
}
function drawDead(){
  if (Math.floor(score)<SCORE_TRANS) scene2D(); else { retroSky(); retroFloor(0.6); }
  G.fillStyle='rgba(0,0,0,0.6)'; G.fillRect(0,0,LW,LH);
  panel('GAME OVER', '#ff5050', '#ff3b3b');
  brandStrip(true);
}
function drawWin(){
  retroSky(); retroFloor(0.85);
  PS.update(); PS.draw();
  const g=G.createRadialGradient(LW/2,LH/2,0,LW/2,LH/2,320);
  g.addColorStop(0,'rgba(120,255,230,0.3)'); g.addColorStop(1,'rgba(0,0,0,0)');
  G.fillStyle=g; G.fillRect(0,0,LW,LH);
  panel('EVOLUCION COMPLETA', '#7dffd6', '#26e6ff');
  G.textAlign='center'; G.fillStyle='#8fe6c4'; G.font='12px Courier New';
  G.fillText('E V O L U C I O N   I M P U L S A D A   P O R', LW/2, LH/2+126);
  brandBadges(LW/2, LH/2+158, 0.6, 1);
  G.textAlign='left';
}
function drawCrash(){
  retroSky(); retroFloor(1);
  obs3.slice().sort((a,b)=>a.z-b.z).forEach(drawBug);
  if (crashT < 10){ G.fillStyle='rgba(255,80,80,'+(0.55*(1-crashT/10))+')'; G.fillRect(0,0,LW,LH); }
  PS.draw();
  const grow=Math.max(0,Math.min(1,(crashT-12)/26));
  const rot=Math.sin(crashT*0.06)*0.12;
  drawAngel(flyDino.x, flyDino.y, rot, 1+grow*0.15, crashT*0.2, grow);
  G.textAlign='center';
  if (crashT<16){ glow('#ff3b3b',14); G.fillStyle='#ff6b6b'; G.font='bold 32px Courier New'; G.fillText('\u00a1IMPACTO!', LW/2, 84); noGlow(); }
  else { glow('#ffe88a',16); G.fillStyle='rgba(255,244,200,'+grow+')'; G.font='bold 30px Courier New'; G.fillText('EVOLUCION...', LW/2, 84); noGlow(); }
  G.textAlign='left';
  brandStrip(true);
}
function drawClose(){
  closeT++;
  retroSky(); retroFloor(0.55);
  G.fillStyle='rgba(4,2,12,0.5)'; G.fillRect(0,0,LW,LH);
  // polvo de estrellas de fondo
  if (closeT%3===0) PS.spawn(Math.random()*LW, LH+5, 'dust', { vx:(Math.random()-0.5)*0.4, vy:-0.6-Math.random()*0.8, g:0, decay:0.006, sz:2+Math.random()*2, hue:50+Math.random()*200, sat:90 });
  PS.update(); PS.draw();
  glow('#ff2db8',18); G.textAlign='center'; G.fillStyle='#ffffff'; G.font='bold 30px Courier New';
  G.fillText('SOBREVIVE A LA EXTINCI\u00d3N', LW/2, 84);
  glow('#ffe88a',16); G.fillStyle='#ffe88a'; G.font='bold 26px Courier New';
  G.fillText('CON LA EDUCACI\u00d3N Y LA IA', LW/2, 118); noGlow();
  const cy=250;
  badge('platzi', LW/2-228, cy, 1.05);
  badge('devin',  LW/2+228, cy, 1.05);
  const bob=Math.sin(closeT*0.06)*9, rot=Math.sin(closeT*0.05)*0.08;
  drawAngel(LW/2, cy+bob, rot, 1.7, closeT*0.12, 1);
  G.textAlign='center'; G.fillStyle='#cfe9ff'; G.font='15px Courier New';
  G.fillText('Llegaste a '+Math.floor(score)+' puntos \u00b7 Mejor '+hi, LW/2, 332);
  if (Math.floor(Date.now()/500)%2===0){ G.fillStyle='#fff'; G.font='bold 15px Courier New'; G.fillText('ESPACIO / CLICK para reiniciar', LW/2, 372); }
  G.textAlign='left';
}

// ===== bucle =====
function loop(){
  G.setTransform(1,0,0,1,0,0); G.filter='none'; G.globalCompositeOperation='source-over'; G.globalAlpha=1;
  if (shake>0){ G.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.9; if(shake<0.4) shake=0; }
  G.clearRect(-20,-20,LW+40,LH+40);
  let chrom = false;
  switch(state){
    case ST.START: drawStart(); break;
    case ST.D2: update2D(); draw2D(); break;
    case ST.TRANS: updateTransition(); chrom = drawTransition(); break;
    case ST.D3:
      update3D();
      draw3DWorld();
      // motion blur sutil (sensación de velocidad)
      G.save(); G.setTransform(1,0,0,1,0,0); G.globalCompositeOperation='lighter'; G.globalAlpha=0.12; G.drawImage(PV,0,0); G.restore();
      PVX.setTransform(1,0,0,1,0,0); PVX.globalCompositeOperation='source-over'; PVX.clearRect(0,0,LW,LH); PVX.drawImage(C,0,0);
      draw3DHud();
      break;
    case ST.CRASH: updateCrash(); drawCrash(); break;
    case ST.CLOSE: drawClose(); break;
    case ST.DEAD: drawDead(); break;
    case ST.WIN: drawWin(); break;
  }

  // ===== post-proceso =====
  if (chrom){ chromAberration(4 + (Math.random()*4|0)); }
  if (state===ST.D3 || state===ST.CRASH || state===ST.CLOSE || state===ST.WIN || state===ST.TRANS){
    bloom(state===ST.TRANS ? 0.4 : 0.46, 6);
    vignette(0.42);
    scanlines(0.16);
    grain(0.05);
  } else if (state===ST.START){
    bloom(0.4, 6); vignette(0.35);
  } else if (state===ST.DEAD){
    vignette(0.4);
  } else {
    // Fase 1: viñeta muy leve para enmarcar
    vignette(0.18);
  }

  G.setTransform(1,0,0,1,0,0); G.filter='none'; G.globalCompositeOperation='source-over'; G.globalAlpha=1;
  requestAnimationFrame(loop);
}
loop();
</script>
